name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes an in-flight run for the same ref, so a busy queue does
# not spend runners on commits nobody is waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Lint and test are separate jobs because they cannot share build artifacts:
  # clippy's wrapper emits `.rmeta`, not the codegen `cargo test` links. Run in
  # one job they are two near-full builds under a single clock, which is what
  # exhausted the old 20-minute budget mid-suite.
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 60 rather than 45 for the Windows runner, which is slower than the others
    # before any Flux-specific cost, and then pays one more: the archive
    # freshness check in `src/llvm/pipeline.rs` spawns a bare `ar`, which does
    # not exist under an llvm-ar/lib.exe toolchain, so the check always reports
    # stale and the stdlib archive is rebuilt on every native link.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Install Linux native build toolchain
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils lld

      # The native backend emits LLVM IR as *text* and shells out, so LLVM is a
      # runtime dependency of the test suite rather than a linked one — there is
      # no llvm-sys or inkwell in the tree.
      #
      # MSVC alone is not enough. `detect_c_toolchain` accepts `cl.exe`, but the
      # single-pass `clang -c -x ir` path declines an MSVC toolchain outright, so
      # codegen would fall back to `opt` + `llc` — neither of which MSVC ships.
      # `rust_staticlib_path` also probes only `llvm-nm`/`nm` for its sentinel
      # symbol, and without one `flux_async_*` goes unresolved at link. So this
      # install is load-bearing, not a convenience.
      #
      # Pinned for the same reason the Rust toolchain above is pinned: an
      # unpinned LLVM is a silent version bump landing in snapshot output.
      # `find_tool` probes `C:\Program Files\LLVM\bin` directly, which is where
      # this puts it.
      - name: Install Windows native build toolchain
        if: ${{ runner.os == 'Windows' }}
        run: choco install llvm --version=22.1.8 -y --no-progress

      # Built as its own step so a compile failure is reported as a compile
      # failure, and so the run step's duration reflects only the tests.
      - name: Build tests
        run: cargo test --all --all-features --no-run

      - name: Tests
        run: cargo test --all --all-features
