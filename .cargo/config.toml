[alias]
# `--no-default-features` keeps the `repl` feature (and its `rustyline` →
# `clipboard-win` dependency) out of the flux staticlib that native binaries link,
# so generated executables carry no Win32 clipboard imports for Windows Defender to
# flag. `llvm` re-enables the native backend (`llvm = ["native"]`).
native = ["run", "--no-default-features", "--features", "llvm", "--", "--native"]
# Repository tasks: `cargo xtask verify <tag> [--base <tag> --cmp]`, `sweep [--determinism]`,
# `compare [--content]` (xtask/src/main.rs).
# Its own target dir, so the cargo commands it runs never relink the running xtask.
xtask = ["run", "--package", "xtask", "--quiet", "--target-dir", "target/xtask", "--"]
