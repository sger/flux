# The child the `Flow.Process` fixture spawns. A program of our own rather
# than a system command: Windows ships nothing that passes an argument vector
# through unaltered, and the fixture's whole subject is that arguments reach a
# child exactly as given. See tests/support/proc_helper.rs.
[[bin]]
name = "flux_proc_helper"
path = "tests/support/proc_helper.rs"

