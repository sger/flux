[package]
name = "flux-dap"
version = "0.0.1"
edition = "2024"
authors = ["Spiros Gerokostas <spiros.gerokostas@gmail.com>"]
license = "MIT"
description = "Debug Adapter Protocol server for the Flux language."

[[bin]]
name = "flux-dap"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
flux = { path = "../..", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
insta = { version = "1.41", features = ["yaml"] }
