[workspace]
members = [".", "crates/flux-lsp", "crates/flux-dap", "xtask"]
exclude = ["vendor/clipboard-win-stub"]
resolver = "2"

# The lints rust-lang/rust adds to every in-tree crate. CI's clippy runs with
# -D warnings, so a new one fails there.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"

# Replace `rustyline`'s transitive `clipboard-win` dependency (Windows-only) with a
# local no-op stub. clipboard-win's Win32 clipboard/bitmap imports made small
# unsigned flux binaries trip Windows Defender's ML heuristic
# (`Trojan:Win32/Wacatac.B!ml`); the stub keeps rustyline's editing + internal
# kill-ring but links no clipboard APIs. See vendor/clipboard-win-stub/src/lib.rs.
[patch.crates-io]
clipboard-win = { path = "vendor/clipboard-win-stub" }

[package]
name = "flux"
version = "0.0.7"
edition = "2024"
authors = ["Spiros Gerokostas <spiros.gerokostas@gmail.com>"]
license = "MIT"
default-run = "flux"

[features]
default = ["repl"]
native = []
llvm = ["native", "dep:backtrace", "dep:addr2line", "dep:gimli", "dep:object"]
# Interactive `flux repl` (proposals 0175 / 0176). Pulls in `rustyline`, which on
# Windows transitively depends on `clipboard-win` — its Win32 clipboard/bitmap
# imports make the small native binaries that link the flux staticlib look like
# clipboard-hijacking malware to Windows Defender. Native builds therefore use
# `--no-default-features` so the REPL (and clipboard-win) stay out of the staticlib.
repl = ["dep:rustyline"]

[lib]
crate-type = ["rlib", "staticlib"]

[lints]
workspace = true

[dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.11"
# Async I/O reactor (proposal 0174 Phase 1a).
mio = { version = "1.0", features = ["os-poll", "net"] }
# Interactive `flux repl` line editing + history (proposal 0175). Optional and
# behind the default `repl` feature so native builds can exclude it (see above).
rustyline = { version = "14.0", optional = true }
# A native program's own panic trace: its frames, named from its DWARF line
# table (proposal 0188 S10a). In the staticlib only.
backtrace = { version = "0.3.76", optional = true }

# On Windows, `backtrace` names frames only from a PDB, which a plain native
# build has none of: the program reads the Flux DWARF line table its .exe
# keeps instead (0188 S10a). In the staticlib only.
[target.'cfg(windows)'.dependencies]
addr2line = { version = "0.25", default-features = false, optional = true }
gimli = { version = "0.32", default-features = false, features = ["read", "endian-reader", "std"], optional = true }
object = { version = "0.37", default-features = false, features = ["read_core", "pe", "std"], optional = true }

[dev-dependencies]
insta = { version = "1.41", features = ["yaml"] }
criterion = "0.5"

[profile.dev]
opt-level = 1
debug-assertions = false
overflow-checks = false

[profile.dev.package.flux]
opt-level = 3

[profile.dev-fast]
inherits = "dev"
opt-level = 3
debug = 1
debug-assertions = false
overflow-checks = false

